<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANT Youth Foundation | Empowering Next-Gen STEM Leaders</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #334155;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --white: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--white);
        }

        /* 顶部导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.2em;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95em;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* 头部 Hero 区域 */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }

        header h1 {
            margin: 15px 0;
            font-size: 3em;
            letter-spacing: -1px;
            font-weight: 800;
        }

        header p {
            margin: 0 auto;
            font-size: 1.25em;
            color: #94a3b8;
            max-width: 650px;
        }

        .badge {
            display: inline-block;
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        /* 容器布局 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        section {
            margin-bottom: 80px;
        }

        h2 {
            color: var(--primary);
            font-size: 2.2em;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section-desc {
            font-size: 1.1em;
            color: #64748b;
            max-width: 800px;
            margin-bottom: 40px;
        }

        /* 网格卡片 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 1.4em;
        }

        .card p {
            color: #475569;
        }

        /* Ria 个人介绍与布局 */
        .leadership-card {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            align-items: center;
        }

        .profile-img {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .leadership-info {
            flex: 1;
            min-width: 300px;
        }

        .leadership-info h3 {
            font-size: 1.8em;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .leadership-title {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.05em;
            margin-bottom: 15px;
        }

        /* 图库画廊 (Gallery) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .gallery-item img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .gallery-caption {
            padding: 12px 15px;
            background: var(--white);
            border: 1px solid var(--border-color);
            border-top: none;
            font-size: 0.9em;
            color: #475569;
            font-weight: 600;
        }

        /* 数据/亮点条带 */
        .stats-banner {
            background: var(--bg-light);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 50px 20px;
            margin: 40px 0;
        }

        .stats-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            text-align: center;
        }

        .stat-item h4 {
            font-size: 2.5em;
            color: var(--accent);
            margin-bottom: 5px;
            font-weight: 800;
        }

        .
